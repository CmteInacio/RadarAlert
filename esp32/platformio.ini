; PlatformIO project para o firmware do display do RadarAlert.
; Board genérica esp32dev — ajustar para a variante exata da placa Ideaspark
; usada, se necessário (e reaproveitar o User_Setup.h do TFT_eSPI já usado
; em projetos anteriores com essa mesma placa).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    -DUSER_SETUP_LOADED=1
    -include include/TFT_eSPI_User_Setup.h
